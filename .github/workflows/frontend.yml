# ── Frontend CI — Flutter Web ────────────────────────────────
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch: # allow manual trigger

env:
  FLUTTER_VERSION: "3.29.1"

jobs:
  analyze-and-build:
    name: Analyze & Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux
          restore-keys: flutter-

      - name: Install Flutter SDK
        run: |
          if [ ! -d "/opt/flutter" ]; then
            git clone https://github.com/flutter/flutter.git /opt/flutter -b stable --depth 1
          fi
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v
        working-directory: .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web release
        run: flutter build web --release --base-href "/finance-tracker-personal/"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: frontend/build/web/
          retention-days: 14

  # ── Optional: Deploy to GitHub Pages ──────────────────────
  # To enable: repo Settings → Pages → Source → GitHub Actions
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: analyze-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: ./web

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
